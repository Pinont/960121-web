<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Complete - Stylish Shoes</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    * {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .credential-container {
      max-width: 500px;
      width: 100%;
    }

    .credential-card {
      background: white;
      border: none;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    .credential-header {
      background: linear-gradient(135deg, #ce071e 0%, #a90517 100%);
      padding: 40px 30px;
      text-align: center;
      color: white;
    }

    .credential-header h1 {
      font-size: 32px;
      font-weight: 600;
      margin: 0;
    }

    .credential-header p {
      margin: 10px 0 0 0;
      font-size: 14px;
      opacity: 0.9;
    }

    .credential-body {
      padding: 40px 30px;
    }

    .success-icon {
      text-align: center;
      margin-bottom: 30px;
    }

    .success-icon svg {
      width: 64px;
      height: 64px;
      color: #22c55e;
    }

    .credential-info {
      background: #f9fafb;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 30px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      font-weight: 600;
      color: #374151;
      font-size: 14px;
    }

    .info-value {
      color: #6b7280;
      font-size: 14px;
      word-break: break-all;
    }

    .credential-footer {
      text-align: center;
    }

    .btn-red {
      background: #ce071e;
      border: none;
      color: white;
      padding: 12px 30px;
      border-radius: 6px;
      font-weight: 600;
      transition: background 0.3s;
      text-decoration: none;
      display: inline-block;
      margin: 0 10px;
    }

    .btn-red:hover {
      background: #a90517;
      color: white;
    }

    .btn-outline {
      background: transparent;
      border: 2px solid #ce071e;
      color: #ce071e;
      padding: 10px 28px;
      border-radius: 6px;
      font-weight: 600;
      transition: all 0.3s;
      text-decoration: none;
      display: inline-block;
      margin: 0 10px;
    }

    .btn-outline:hover {
      background: #ce071e;
      color: white;
    }

    .copy-btn {
      background: none;
      border: none;
      color: #ce071e;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      padding: 0;
    }

    .copy-btn:hover {
      text-decoration: underline;
    }

    .message {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      margin-top: 20px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #6b7280;
    }

    .spinner {
      border: 3px solid #f3f4f6;
      border-top: 3px solid #ce071e;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <div class="credential-container">
    <div class="credential-card" id="credentialCard" style="display: none;">
      <div class="credential-header">
        <h1>Welcome!</h1>
        <p>Registration Complete</p>
      </div>
      <div class="credential-body">
        <div class="success-icon">
          <svg fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
          </svg>
        </div>

        <div class="credential-info">
          <div class="info-row">
            <span class="info-label">Name</span>
            <span class="info-value" id="credentialName">-</span>
          </div>
          <div class="info-row">
            <span class="info-label">Email</span>
            <span class="info-value" id="credentialEmail">-</span>
          </div>
          <div class="info-row">
            <span class="info-label">User ID</span>
            <span class="info-value" id="credentialId">-</span>
          </div>
          <div class="info-row">
            <span class="info-label">Created</span>
            <span class="info-value" id="credentialDate">-</span>
          </div>
        </div>

        <p class="message">Your account has been created successfully. You can now log in and start shopping!</p>

        <div class="credential-footer">
          <a href="index.html" class="btn-red">Back to Store</a>
          <a href="index.html" class="btn-outline">Continue Shopping</a>
        </div>
      </div>
    </div>

    <div class="loading" id="loadingCard">
      <div class="spinner"></div>
      <p>Loading your credentials...</p>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const credentials = sessionStorage.getItem('userCredentials');
      const loadingCard = document.getElementById('loadingCard');
      const credentialCard = document.getElementById('credentialCard');

      if (credentials) {
        try {
          const user = JSON.parse(credentials);
          
          // Populate credential info
          document.getElementById('credentialName').textContent = user.name || '-';
          document.getElementById('credentialEmail').textContent = user.email || '-';
          document.getElementById('credentialId').textContent = user.id || '-';
          
          // Format date
          if (user.created_at) {
            const date = new Date(user.created_at);
            document.getElementById('credentialDate').textContent = date.toLocaleString();
          } else {
            document.getElementById('credentialDate').textContent = '-';
          }
          
          // Show credential card
          loadingCard.style.display = 'none';
          credentialCard.style.display = 'block';
          
          // Clear sessionStorage
          sessionStorage.removeItem('userCredentials');
        } catch (error) {
          console.error('Error parsing credentials:', error);
          loadingCard.innerHTML = '<p style="color: #ef4444;">Error loading credentials. Please try again.</p>';
        }
      } else {
        loadingCard.innerHTML = '<p style="color: #ef4444;">No credentials found. <a href="index.html" style="color: #ce071e;">Go back to register</a></p>';
      }
    });
  </script>
</body>

</html>
